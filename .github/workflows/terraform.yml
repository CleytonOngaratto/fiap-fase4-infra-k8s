name: Terraform - Infra K8s (VPC + EKS + ECR)

# Sem paths-ignore no pull_request: workflow pulado por filtro deixa o check obrigatório "Pending" e trava o merge.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        type: choice
        required: true
        default: plan
        options: [ plan, apply, destroy ]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_cluster_role_name: ${{ vars.CLUSTER_ROLE_NAME }}
  TF_VAR_node_role_name: ${{ vars.NODE_ROLE_NAME }}

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (sem backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  terraform:
    if: github.event_name == 'workflow_dispatch'
    needs: fmt-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Só funciona logo após o configure-aws-credentials: com token expirado ele falha antes de qualquer outro step.
      - name: Lab session expirada?
        if: failure()
        run: |
          echo "::error::Credencial do AWS Academy expirou ou esta invalida (a sessao dura ~4h)."
          echo "::error::Abra o lab, atualize ~/.aws/credentials e rode scripts/refresh-gh-secrets.ps1 -Org <org>."
          echo "::error::O AWS_SESSION_TOKEN e obrigatorio; sem ele o erro vem como InvalidClientTokenId."

      - name: Check lab session
        run: aws sts get-caller-identity

      - name: Check repository variables
        run: |
          missing=0
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Repository variable TF_STATE_BUCKET nao definida (valor: o bucket criado pelo scripts/bootstrap-backend.ps1)."
            missing=1
          fi
          if [ -z "${{ vars.CLUSTER_ROLE_NAME }}" ] || [ -z "${{ vars.NODE_ROLE_NAME }}" ]; then
            echo "::error::As repository variables CLUSTER_ROLE_NAME e NODE_ROLE_NAME sao obrigatorias."
            echo "::error::Os nomes reais tem sufixo gerado pelo lab e mudam se o laboratorio for resetado."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::Settings > Secrets and variables > Actions > Variables (NAO sao secrets)."
            echo "::error::Rode scripts/preflight.ps1 e depois scripts/refresh-gh-secrets.ps1 -Org <org>"
            echo "::error::  -ClusterRoleName <valor> -NodeRoleName <valor> -StateBucket <bucket>."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-k8s/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Show outputs
        if: success() && github.event_name != 'pull_request'
        run: terraform output || true
