# Teste de fumaça 2 (ver README): NLB INTERNO nas subnets privadas.
#
# Por que um manifesto em vez de `kubectl expose --type=LoadBalancer` + `kubectl annotate`:
# as anotações precisam existir NO MOMENTO da criação do Service. Se o cloud controller já começou
# a provisionar, ele cria um LB público e NÃO reconcilia para interno depois — e você interpretaria
# o resultado como "a tag internal-elb não funciona", que é a conclusão errada.
#
# Este arquivo NÃO é a app. É descartável: existe para responder, no dia 1, se o desenho
# "NLB interno + VPC Link v2" é viável nesta conta antes de o API Gateway depender disso.
apiVersion: v1
kind: Service
metadata:
  name: smoke-int
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    # Label que `kubectl create deployment smoke` gera. Se mudar o nome do deployment, mude aqui.
    app: smoke
  ports:
    - port: 80
      targetPort: 80
